name: Release APK

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Resolve Android SDK path
        shell: bash
        run: |
          ANDROID_SDK_ROOT_VALUE="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT_VALUE}" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT_VALUE}" >> "$GITHUB_ENV"
          echo "sdk.dir=${ANDROID_SDK_ROOT_VALUE}" > local.properties

      - name: Install Android SDK packages
        shell: bash
        run: |
          if [ -x "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "${ANDROID_SDK_ROOT}/cmdline-tools/bin/sdkmanager" ]; then
            SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/bin/sdkmanager"
          else
            echo "sdkmanager not found under ${ANDROID_SDK_ROOT}" >&2
            exit 1
          fi

          set +o pipefail
          yes | "${SDKMANAGER}" --licenses > /dev/null
          LICENSE_STATUS=$?
          set -o pipefail
          if [ "${LICENSE_STATUS}" -ne 0 ]; then
            echo "sdkmanager --licenses failed with status ${LICENSE_STATUS}" >&2
            exit "${LICENSE_STATUS}"
          fi

          "${SDKMANAGER}" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease --stacktrace --warning-mode all

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: touch-diagnostic-${{ github.ref_name }}
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish GitHub release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          ASSET_NAME="touch-diagnostic-${TAG_NAME}.apk"

          if ! gh release view "${TAG_NAME}" > /dev/null 2>&1; then
            gh release create "${TAG_NAME}" \
              --title "${TAG_NAME}" \
              --generate-notes
          fi

          gh release upload "${TAG_NAME}" "${APK_PATH}#${ASSET_NAME}" --clobber
